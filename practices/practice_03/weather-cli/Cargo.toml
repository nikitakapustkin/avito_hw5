[package]
name = "weather-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "weather"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
