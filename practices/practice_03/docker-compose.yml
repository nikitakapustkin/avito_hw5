version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: weather_service_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: weather_service_app
    ports:
      - "8000:8000"
    environment:
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: python -m uvicorn weather_service.app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  redis_data:
